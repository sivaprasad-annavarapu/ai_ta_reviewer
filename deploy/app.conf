# AWF app descriptor (kit v2) — the ONLY per-app file the kit reads.
# Read by awf.py, start-all.sh, stop-all.sh, deploy-aws.sh and, on the server,
# deploy/remote-install.sh. Same keys in every repo. Rules: ~/GRCKEY/AWF_CONVENTIONS.md
# Local ports = AWS ports: localhost:<PUBLIC_PORT> is the same app as https://65.0.35.71:<PUBLIC_PORT>.
APP=tfa
TITLE="TFA Tax Filings Analyser"
PUBLIC_PORT=9003
APP_PORT=19003
LOCAL_PORT=9003
LOCAL_VENV=.venv
LOCAL_START="-m tfa.server --port 9003"
SERVER_START="-m tfa.server --port 19003"
REQUIREMENTS=requirements.txt
WORKDIR=.
ENV_MODE=var
ENV_VAR=TFA_ENV_FILE
REQUIRED_KEYS="ANTHROPIC_API_KEY"
HEALTH_PATH=/api/status
DB=1                                   # server DB tfa; local via the tunnel; migrates on start
DB_PREFIX=TFA
RUNTIME_DIRS=".tfa-cache/ out/"
# Client data is allow-listed: only the synthetic ACME client goes to the server.
SHIP_TOP=""
SHIP_ONLY="/filings/ACME-PVT-LTD/ /clients/ACME-PVT-LTD.yaml /scrutiny/reference/ /scrutiny/ACME-PVT-LTD/"
EXCLUDES="/.tfa-cache/ /out/ /filings/*/ /clients/*.yaml /scrutiny/*/"
MEMORY_MAX=1G
TEST_CMD="./run.sh -m tests.test_invariants"
MIGRATE_STATUS_CMD=".venv/bin/python -m tfa.cli db"
