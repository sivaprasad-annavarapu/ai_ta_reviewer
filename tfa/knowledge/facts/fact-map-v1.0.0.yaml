# ---------------------------------------------------------------------------
# The fact dictionary.
#
# One entry per canonical fact. Each says where to look for it in a return or
# in an audit report, what kind of thing it is, and whether it belongs in the
# trend analysis. The extractor tries `paths` in order first; if none resolve it
# falls back to searching for a leaf named in `keys`, and records that it had
# to. A fact that resolves neither way is *not available* — never zero.
#
# This file is meant to be edited. Real ITR JSON moves fields between schedules
# from one assessment year to the next, and the honest way to handle that is a
# list of candidate paths that a person can extend when they see a new one,
# rather than a clever guess buried in code.
#
# kind:   money | ratio | count | date | text | flag | list
# scope:  3cd | itr            (which document the fact is read from)
# aggregate: first | sum | max | min | count | list | any_true
# trend:  true where a series across years is meaningful
# ---------------------------------------------------------------------------
schema_version: 1
version: 1.0.0

groups:
  - id: identity
    label: Identity and filing
  - id: pl
    label: Profit and loss
  - id: ratios
    label: Ratios reported in the audit report
  - id: depreciation
    label: Depreciation
  - id: disallowance
    label: Disallowances and inadmissible amounts
  - id: statutory
    label: Statutory dues and 43B
  - id: tds
    label: Tax deducted at source
  - id: cash
    label: Cash transactions
  - id: stock
    label: Stock and quantitative details
  - id: losses
    label: Losses and unabsorbed depreciation
  - id: computation
    label: Computation of income and tax
  - id: balance_sheet
    label: Balance sheet
  - id: flags
    label: Particulars answered yes or no

facts:

  # ======================================================== identity =======
  - id: name_3cd
    label: Name of the assessee (audit report)
    group: identity
    scope: 3cd
    kind: text
    clause: "1"
    paths: ["**.PartA.AssesseeName", "PartA.AssesseeName"]
    keys: [NameOfAssessee, AssesseeName, SurNameOrOrgName]

  - id: pan_3cd
    label: PAN (audit report)
    group: identity
    scope: 3cd
    kind: text
    clause: "2"
    paths: ["**.PartA.PAN", "PartA.PAN"]
    keys: [PAN]

  - id: status_3cd
    label: Status code (audit report)
    group: identity
    scope: 3cd
    kind: text
    clause: "3"
    paths: ["**.PartA.Status", "PartA.Status"]
    keys: [Status]

  - id: py_start_3cd
    label: Previous year begins
    group: identity
    scope: 3cd
    kind: date
    paths: ["**.PartA.PartAStartDate", "PartA.PartAStartDate"]
    keys: [PartAStartDate]

  - id: py_end_3cd
    label: Previous year ends
    group: identity
    scope: 3cd
    kind: date
    paths: ["**.PartA.PartAEndDate", "PartA.PartAEndDate"]
    keys: [PartAEndDate]

  - id: audit_clause_3cd
    label: Clause of section 44AB under which the audit was required
    group: identity
    scope: 3cd
    kind: list
    clause: "44AB"
    paths: ["**.PartA.Clause.*.ClauseNo", "PartA.Clause.*.ClauseNo"]
    keys: [ClauseNo]
    aggregate: list

  - id: gstin_3cd
    label: Indirect tax registration numbers
    group: identity
    scope: 3cd
    kind: list
    clause: "4"
    paths: ["**.PartA.Form3cdIndirectTax.*.RegNo", "**.Form3cdIndirectTax.*.RegNo"]
    keys: [RegNo, GSTIN]
    aggregate: list

  - id: signed_on_3cd
    label: Date the audit report was signed
    group: identity
    scope: 3cd
    kind: date
    paths: ["**.OtherInformation1.Date", "OtherInformation1.Date", "**.OtherInformation2.Date"]
    keys: [DateOfSigning, SigningDate]

  - id: membership_no_3cd
    label: Membership number of the signing accountant
    group: identity
    scope: 3cd
    kind: text
    paths: ["**.OtherInformation1.MembershipNo", "OtherInformation1.MembershipNo"]
    keys: [MembershipNo, MembershipNumber]

  - id: firm_reg_no_3cd
    label: Firm registration number of the auditor
    group: identity
    scope: 3cd
    kind: text
    paths: ["**.OtherInformation1.FirmRegNum", "OtherInformation1.FirmRegNum"]
    keys: [FirmRegNum, FRN]

  - id: created_on_3cd
    label: Date the audit report JSON was created
    group: identity
    scope: 3cd
    kind: date
    paths: ["**.CreationInfo.JSONCreationDate", "CreationInfo.JSONCreationDate"]
    keys: [JSONCreationDate]

  - id: books_maintained_3cd
    label: Books of account maintained
    group: identity
    scope: 3cd
    kind: list
    clause: "11(b)"
    paths: ["**.Form3cdBooksOfAccLst.*.BooksMaintained",
            "**.Form3cdBooksOfAccLst.*.Form3cdBooksOfAccLstPK.BooksMaintained"]
    keys: [BooksMaintained, BooksOfAccount]
    aggregate: list

  - id: method_of_accounting_3cd
    label: Method of accounting employed
    group: identity
    scope: 3cd
    kind: text
    clause: "13(a)"
    paths: ["**.Form3cdChngMethAccVal.MethodOfAcc", "**.PartA.MethodOfAcc"]
    keys: [MethodOfAcc, MethodOfAccounting]

  - id: presumptive_section_3cd
    label: Section under which presumptive income is reported
    group: identity
    scope: 3cd
    kind: list
    clause: "12"
    paths: ["**.Form3cdProfGainsPresum.*.SectionNo", "**.Form3cdProfGainsPresum.SectionNo"]
    keys: [SectionNo]
    aggregate: list

  - id: presumptive_amount_3cd
    label: Profit assessable on a presumptive basis
    group: identity
    scope: 3cd
    kind: money
    clause: "12"
    trend: true
    paths: ["**.Form3cdProfGainsPresum.*.Amount", "**.Form3cdProfGainsPresum.Amount"]
    aggregate: sum

  - id: name_itr
    label: Name of the assessee (return)
    group: identity
    scope: itr
    kind: text
    paths: ["**.OrgFirmInfo.AssesseeName", "**.PersonalInfo.AssesseeName", "**.PartA_GEN1.AssesseeName"]
    keys: [AssesseeName, NameOfAssessee, SurNameOrOrgName]

  - id: pan_itr
    label: PAN (return)
    group: identity
    scope: itr
    kind: text
    paths: ["**.OrgFirmInfo.PAN", "**.PersonalInfo.PAN", "**.PartA_GEN1.PAN"]
    keys: [PAN]

  - id: return_filed_section_itr
    label: Section under which the return was filed
    group: identity
    scope: itr
    kind: text
    keys: [ReturnFileSec, IncomeTaxSec]
    paths: ["**.FilingStatus.ReturnFileSec.IncomeTaxSec", "**.FilingStatus.ReturnFileSec"]
  - id: return_filed_on_itr
    label: Date the return JSON was created
    group: identity
    scope: itr
    kind: date
    paths: ["**.CreationInfo.JSONCreationDate"]
    keys: [JSONCreationDate, FilingDate, DateOfFiling]

  - id: audit_flag_itr
    label: Return states that the accounts are liable to audit
    group: identity
    scope: itr
    kind: flag
    keys: [LiableSec44ABflg, LiableToAudit, AuditedByAccountantFlg]
    paths: ["**.PartA_GEN2.LiableSec44ABflg", "**.AuditInfo.LiableToAudit"]
  - id: audit_date_itr
    label: Date of the audit report as stated in the return
    group: identity
    scope: itr
    kind: date
    keys: [AuditDate, AuditReportDate, AuditReportFurnishDate]
    paths: ["**.AuditInfo.AuditDate", "**.AuditInfo.AuditReportFurnishDate", "**.AuditInfo.AuditReportDate"]
  - id: auditor_membership_itr
    label: Membership number of the auditor as stated in the return
    group: identity
    scope: itr
    kind: text
    keys: [AuditorMemNo, MembershipNo, MembNo]
    paths: ["**.AuditInfo.AuditorMemNo", "**.AuditInfo.MembershipNo"]
  - id: nature_of_business_itr
    label: Business or profession code reported in the return
    group: identity
    scope: itr
    kind: list
    keys: [Code, BusinessCode, NatureOfBusiness]
    within: NatureOfBusiness
    aggregate: list

  # ============================================================ ratios =====
    paths: ["**.NatureOfBusiness.*.Code", "**.NatureOfBusiness.NatureOfBusiness.*.Code"]
  - id: turnover_3cd
    label: Total turnover reported in the audit report
    group: ratios
    scope: 3cd
    kind: money
    clause: "40"
    trend: true
    paths: ["**.Form3cdAccountingRatioCalculations.PrevYrProfTurnOvr.TotalTurnover"]
    keys: [TotalTurnover]
    within: PrevYrProfTurnOvr

  - id: turnover_prec_3cd
    label: Total turnover of the preceding year, as stated in this year's report
    group: ratios
    scope: 3cd
    kind: money
    clause: "40"
    paths: ["**.Form3cdAccountingRatioCalculations.PrecPrevYrProfTurnOvr.TotalTurnover"]
    keys: [TotalTurnover]
    within: PrecPrevYrProfTurnOvr

  - id: gp_ratio_3cd
    label: Gross profit to turnover (%)
    group: ratios
    scope: 3cd
    kind: ratio
    clause: "40"
    trend: true
    paths: ["**.Form3cdAccountingRatioCalculations.PrevYrProfTurnOvr.GrossprofitTurnover"]
    keys: [GrossprofitTurnover]
    within: PrevYrProfTurnOvr

  - id: gp_ratio_prec_3cd
    label: Gross profit to turnover of the preceding year, as stated in this year's report
    group: ratios
    scope: 3cd
    kind: ratio
    clause: "40"
    paths: ["**.Form3cdAccountingRatioCalculations.PrecPrevYrProfTurnOvr.GrossprofitTurnover"]
    keys: [GrossprofitTurnover]
    within: PrecPrevYrProfTurnOvr

  - id: np_ratio_3cd
    label: Net profit to turnover (%)
    group: ratios
    scope: 3cd
    kind: ratio
    clause: "40"
    trend: true
    paths: ["**.Form3cdAccountingRatioCalculations.PrevYrProfTurnOvr.NetprofitTurnover1"]
    keys: [NetprofitTurnover1, NetprofitTurnover]
    within: PrevYrProfTurnOvr

  - id: np_ratio_prec_3cd
    label: Net profit to turnover of the preceding year, as stated in this year's report
    group: ratios
    scope: 3cd
    kind: ratio
    clause: "40"
    paths: ["**.Form3cdAccountingRatioCalculations.PrecPrevYrProfTurnOvr.NetprofitTurnover1"]
    keys: [NetprofitTurnover1, NetprofitTurnover]
    within: PrecPrevYrProfTurnOvr

  - id: stock_ratio_3cd
    label: Stock-in-trade to turnover (%)
    group: ratios
    scope: 3cd
    kind: ratio
    clause: "40"
    trend: true
    paths: ["**.Form3cdAccountingRatioCalculations.PrevYrProfTurnOvr.StockInTrade"]
    keys: [StockInTrade]
    within: PrevYrProfTurnOvr

  - id: material_ratio_3cd
    label: Material consumed to finished goods produced (%)
    group: ratios
    scope: 3cd
    kind: ratio
    clause: "40"
    trend: true
    paths: ["**.Form3cdAccountingRatioCalculations.PrevYrProfTurnOvr.MaterialconsumedFinishedgoods"]
    keys: [MaterialconsumedFinishedgoods]
    within: PrevYrProfTurnOvr

  - id: gp_numerator_3cd
    label: Gross profit (numerator of the ratio)
    group: pl
    scope: 3cd
    kind: money
    clause: "40"
    trend: true
    paths: ["**.Form3cdAccountingRatioCalculations.PrevYrProfTurnOvr.GrosProfNumertr"]
    keys: [GrosProfNumertr]
    within: PrevYrProfTurnOvr

  - id: np_numerator_3cd
    label: Net profit (numerator of the ratio)
    group: pl
    scope: 3cd
    kind: money
    clause: "40"
    trend: true
    paths: ["**.Form3cdAccountingRatioCalculations.PrevYrProfTurnOvr.NetProfNumertr"]
    keys: [NetProfNumertr]
    within: PrevYrProfTurnOvr

  - id: stock_numerator_3cd
    label: Stock in trade (numerator of the ratio)
    group: stock
    scope: 3cd
    kind: money
    clause: "40"
    trend: true
    paths: ["**.Form3cdAccountingRatioCalculations.PrevYrProfTurnOvr.StockTradeNmrtr"]
    keys: [StockTradeNmrtr]
    within: PrevYrProfTurnOvr

  # ====================================================== depreciation =====
  - id: dep_opening_wdv_3cd
    label: Opening written down value, all blocks
    group: depreciation
    scope: 3cd
    kind: money
    clause: "18"
    trend: true
    paths: ["**.Form3cdDeprAllw.*.OpeningWDV"]
    aggregate: sum

  - id: dep_additions_3cd
    label: Additions to the blocks during the year
    group: depreciation
    scope: 3cd
    kind: money
    clause: "18"
    trend: true
    paths: ["**.Form3cdDeprAllw.*.TotalPurchaseValue", "**.Form3cdDeprAllw.*.TotalPurchase"]
    aggregate: sum

  - id: dep_deductions_3cd
    label: Deductions from the blocks during the year
    group: depreciation
    scope: 3cd
    kind: money
    clause: "18"
    paths: ["**.Form3cdDeprAllw.*.TotalDeduction", "**.Form3cdDeprAllw.*.Deductions"]
    aggregate: sum

  - id: dep_allowable_3cd
    label: Depreciation allowable, all blocks
    group: depreciation
    scope: 3cd
    kind: money
    clause: "18"
    trend: true
    paths: ["**.Form3cdDeprAllw.*.DepAllowable"]
    aggregate: sum

  - id: dep_closing_wdv_3cd
    label: Closing written down value, all blocks
    group: depreciation
    scope: 3cd
    kind: money
    clause: "18"
    trend: true
    paths: ["**.Form3cdDeprAllw.*.WrittenDownVal"]
    aggregate: sum

  - id: dep_blocks_3cd
    label: Number of blocks of assets reported
    group: depreciation
    scope: 3cd
    kind: count
    clause: "18"
    paths: ["**.Form3cdDeprAllw.*.RateOfDep"]
    aggregate: count

  - id: dep_claimed_itr
    label: Depreciation claimed in the return
    group: depreciation
    scope: itr
    kind: money
    trend: true
    keys: [TotalDepreciation, TotDepreciationAllowable, TotDepreciation]

  # ====================================================== disallowance =====
    paths: ["**.ScheduleDEP.SummaryFromDeprSch.TotalDepreciation", "**.ScheduleDPM.TotDepreciationAllowable"]
  - id: capital_expenditure_3cd
    label: Capital expenditure debited to the profit and loss account
    group: disallowance
    scope: 3cd
    kind: money
    clause: "21(a)"
    trend: true
    paths: ["**.Form3cdDebPLExpnditure.*.Amount"]
    aggregate: sum

  - id: cash_disallowance_3cd
    label: Amounts inadmissible under section 40A(3)
    group: disallowance
    scope: 3cd
    kind: money
    clause: "21(d)"
    trend: true
    paths: ["**.Form3cdIncomeUnderSec40A_3.PaymntSec40A_3A",
            "**.ExpendSec40A_3.*.Amount"]
    keys: [PaymntSec40A_3A]
    aggregate: sum

  - id: payments_40a2b_3cd
    label: Payments to persons specified in section 40A(2)(b)
    group: disallowance
    scope: 3cd
    kind: money
    clause: "23"
    trend: true
    paths: ["**.Form3cdPymtSec40a2bDetail.*.Amount"]
    aggregate: sum

  - id: section_41_3cd
    label: Amounts chargeable under section 41
    group: disallowance
    scope: 3cd
    kind: money
    clause: "25"
    trend: true
    paths: ["**.Form3cdProfGainsTaxSec41.*.Amount"]
    aggregate: sum

  - id: prior_period_3cd
    label: Prior period income or expenditure in the profit and loss account
    group: disallowance
    scope: 3cd
    kind: money
    clause: "27(b)"
    trend: true
    paths: ["**.Form3cdIncExpPriorPlAcc.*.Amount"]
    aggregate: sum

  - id: amounts_not_credited_3cd
    label: Amounts not credited to the profit and loss account
    group: disallowance
    scope: 3cd
    kind: money
    clause: "16"
    paths: ["**.Form3cdAmtNotCredit.*.Amount",
            "**.Form3cdAmtNotCredit.*.Form3cdAmtNotCreditPk.Amount"]
    aggregate: sum

  - id: pf_employee_amount_3cd
    label: Employee contributions to welfare funds received
    group: disallowance
    scope: 3cd
    kind: money
    clause: "20(b)"
    trend: true
    paths: ["**.Form3cdEmpPfSuperann.*.Amount"]
    aggregate: sum

  - id: pf_employee_paid_3cd
    label: Employee contributions actually paid
    group: disallowance
    scope: 3cd
    kind: money
    clause: "20(b)"
    trend: true
    paths: ["**.Form3cdEmpPfSuperann.*.ActualAmount"]
    aggregate: sum

  # ========================================================= statutory =====
  - id: unpaid_43b_3cd
    label: Sums under section 43B unpaid at the year end
    group: statutory
    scope: 3cd
    kind: money
    clause: "26"
    trend: true
    paths: ["**.Form3cdUnpaidStrySec43b.*.Amount"]
    aggregate: sum

  - id: unpaid_43b_preexisting_3cd
    label: Section 43B liability pre-existing on the first day of the previous year
    group: statutory
    scope: 3cd
    kind: money
    clause: "26(A)"
    trend: true
    paths: ["**.Form3cdUnpaidStrySec43b1.*.Amount",
            "**.Form3cdUnpaidStrySec43bInfo.*.Amount"]
    aggregate: sum

  # =============================================================== tds =====
  - id: tds_payments_3cd
    label: Payments on which tax was deductible
    group: tds
    scope: 3cd
    kind: money
    clause: "34(a)"
    trend: true
    paths: ["**.Form3cdChapXVII.*.AmtOfNatureSpec"]
    aggregate: sum

  - id: tds_deducted_3cd
    label: Tax deducted or collected
    group: tds
    scope: 3cd
    kind: money
    clause: "34(a)"
    trend: true
    paths: ["**.Form3cdChapXVII.*.TotTaxDedCollectd"]
    aggregate: sum

  - id: tds_short_rate_3cd
    label: Amount on which tax was deducted at less than the specified rate
    group: tds
    scope: 3cd
    kind: money
    clause: "34(a)"
    paths: ["**.Form3cdChapXVII.*.TotLessThanSpecRate"]
    aggregate: sum

  - id: tds_not_deposited_3cd
    label: Tax deducted but not paid to the credit of the Central Government
    group: tds
    scope: 3cd
    kind: money
    clause: "34(a)"
    trend: true
    paths: ["**.Form3cdChapXVII.*.AmtNotDepToGovt"]
    aggregate: sum

  - id: tds_interest_3cd
    label: Interest payable under section 201(1A) or 206C(7)
    group: tds
    scope: 3cd
    kind: money
    clause: "34(c)"
    trend: true
    paths: ["**.Form3cdSec2011A206C7.*.AmtOfIntrest",
            "**.Form3cdSec2011A206C7.AmtOfIntrest"]
    aggregate: sum

  - id: tds_interest_paid_3cd
    label: Interest under section 201(1A) actually paid
    group: tds
    scope: 3cd
    kind: money
    clause: "34(c)"
    paths: ["**.Form3cdSec2011A206C7.*.AmtPaid", "**.Form3cdSec2011A206C7.AmtPaid"]
    aggregate: sum

  - id: tds_statements_late_3cd
    label: Statements of deduction not furnished within time
    group: tds
    scope: 3cd
    kind: count
    clause: "34(b)"
    paths: ["**.Form3cdTaxDedCollect.*.TransactionsFlag"]
    aggregate: count

  # ============================================================== cash =====
  - id: loans_269ss_3cd
    label: Loans or deposits accepted otherwise than by account payee instrument
    group: cash
    scope: 3cd
    kind: money
    clause: "31(a)"
    trend: true
    paths: ["**.Form3cdSec269SSDtls.*.AmtAccepted",
            "**.Form3cdAmtSec269ssDetail.*.AmtAccepted"]
    aggregate: sum

  - id: repayments_269t_3cd
    label: Loans or deposits repaid otherwise than by account payee instrument
    group: cash
    scope: 3cd
    kind: money
    clause: "31(c)"
    trend: true
    paths: ["**.Form3cdSec269TDtls.*.AmtRepaid",
            "**.Form3cdSec269TNewDtls.*.AmtRepaid",
            "**.Form3cdAmtSec269tDetail.*.AmtRepaid"]
    keys: [AmtRepaid, AmountRepaid]
    aggregate: sum

  - id: receipts_269st_3cd
    label: Receipts covered by section 269ST
    group: cash
    scope: 3cd
    kind: money
    clause: "31(ba)"
    trend: true
    paths: ["**.Form3cdSec269ST31ba.*.Amount", "**.Form3cdSec269ST31bb.*.Amount"]
    aggregate: sum

  # ============================================================= stock =====
  - id: qty_opening_stock_3cd
    label: Opening stock, quantitative details
    group: stock
    scope: 3cd
    kind: count
    clause: "35"
    trend: true
    paths: ["**.Form3cdTradeRawProdDet.*.OpeningStock"]
    aggregate: sum
    note: >-
      Clause 35 is quantitative. These are units of the item, not rupees,
      which is why they are not measured against the rupee materiality
      floor and are not tied out against a value in the balance sheet.
  - id: qty_purchases_3cd
    label: Purchases, quantitative details
    group: stock
    scope: 3cd
    kind: count
    clause: "35"
    trend: true
    paths: ["**.Form3cdTradeRawProdDet.*.PurchasePy"]
    aggregate: sum
    note: >-
      Clause 35 is quantitative. These are units of the item, not rupees,
      which is why they are not measured against the rupee materiality
      floor and are not tied out against a value in the balance sheet.
  - id: qty_sales_3cd
    label: Sales, quantitative details
    group: stock
    scope: 3cd
    kind: count
    clause: "35"
    trend: true
    paths: ["**.Form3cdTradeRawProdDet.*.SalesDurPy"]
    aggregate: sum
    note: >-
      Clause 35 is quantitative. These are units of the item, not rupees,
      which is why they are not measured against the rupee materiality
      floor and are not tied out against a value in the balance sheet.
  - id: qty_closing_stock_3cd
    label: Closing stock, quantitative details
    group: stock
    scope: 3cd
    kind: count
    clause: "35"
    trend: true
    paths: ["**.Form3cdTradeRawProdDet.*.ClosingStock"]
    aggregate: sum
    note: >-
      Clause 35 is quantitative. These are units of the item, not rupees,
      which is why they are not measured against the rupee materiality
      floor and are not tied out against a value in the balance sheet.
  - id: qty_shortage_3cd
    label: Shortage or excess, quantitative details
    group: stock
    scope: 3cd
    kind: count
    clause: "35"
    trend: true
    paths: ["**.Form3cdTradeRawProdDet.*.ShortageExcess"]
    aggregate: sum

  # ============================================================ losses =====
    note: >-
      Clause 35 is quantitative. These are units of the item, not rupees,
      which is why they are not measured against the rupee materiality
      floor and are not tied out against a value in the balance sheet.
  - id: bf_loss_returned_3cd
    label: Brought forward loss or depreciation as returned
    group: losses
    scope: 3cd
    kind: money
    clause: "32(a)"
    trend: true
    paths: ["**.Form3cdBflDa.*.AmtReturned"]
    aggregate: sum

  - id: bf_loss_assessed_3cd
    label: Brought forward loss or depreciation as assessed
    group: losses
    scope: 3cd
    kind: money
    clause: "32(a)"
    trend: true
    paths: ["**.Form3cdBflDa.*.AmtAssessed"]
    aggregate: sum

  - id: bf_loss_years_3cd
    label: Assessment years for which a loss is carried
    group: losses
    scope: 3cd
    kind: list
    clause: "32(a)"
    paths: ["**.Form3cdBflDa.*.AssessmentYear"]
    aggregate: list

  - id: cf_loss_itr
    label: Loss carried forward to future years, per the return
    group: losses
    scope: itr
    kind: money
    trend: true
    keys: [TotalLossCF, TotLossCF]
    paths: ["**.ScheduleCFL.TotalLossCFSummary.LossSummaryDetail.TotalLossCF", "**.TotalLossCFSummary.LossSummaryDetail.BusLossOthThanSpecLossCF"]
  - id: unabsorbed_dep_itr
    label: Unabsorbed depreciation carried forward
    group: losses
    scope: itr
    kind: money
    trend: true
    keys: [TotDepritBalCFNY, UnabsorbedDepreciation]
    paths: ["**.ITRScheduleUD.TotDepritBalCFNY", "**.ScheduleUD.TotDepritBalCFNY"]
  - id: bf_loss_setoff_itr
    label: Brought forward loss set off during the year
    group: losses
    scope: itr
    kind: money
    trend: true
    keys: [BroughtFwdLossesSetoff, TotalBFLossSetOff, TotalBFLossSetoff]

  # ======================================================= computation =====
    paths: ["**.PartB-TI.BroughtFwdLossesSetoff", "**.ScheduleBFLA.TotalBFLossSetOff"]
  - id: turnover_itr
    label: Turnover or gross receipts reported in the return
