# ---------------------------------------------------------------------------
# Derived metrics.
#
# Computed from the facts above, per year, with a small arithmetic expression.
# Only + - * / ( ) and fact identifiers are permitted: a metric must stay
# readable by the person who has to defend it. A metric whose inputs are not all
# available for a year is not computed for that year — it is not zero.
#
# `guard` names a fact that must be non-zero for the metric to mean anything,
# which is how a division by a turnover of nil becomes "not available" rather
# than an exception or an infinity.
# ---------------------------------------------------------------------------
derived:

  - id: expense_ratio
    label: Total expenditure to turnover (%)
    group: pl
    kind: ratio
    trend: true
    expr: total_expenditure_itr / turnover_itr * 100
    guard: turnover_itr

  - id: other_income_share
    label: Other income to total income credited (%)
    group: pl
    kind: ratio
    trend: true
    expr: other_income_itr / (turnover_itr + other_income_itr) * 100
    guard: turnover_itr

  - id: effective_tax_rate
    label: Tax payable to total income (%)
    group: computation
    kind: ratio
    trend: true
    expr: tax_payable_itr / total_income_itr * 100
    guard: total_income_itr

  - id: taxable_to_book_profit
    label: Total income to net profit per books (%)
    group: computation
    kind: ratio
    trend: true
    expr: total_income_itr / net_profit_itr * 100
    guard: net_profit_itr

  - id: debtor_days
    label: Trade receivables in days of turnover
    group: balance_sheet
    kind: ratio
    trend: true
    expr: receivables_itr / turnover_itr * 365
    guard: turnover_itr

  - id: creditor_days
    label: Trade payables in days of expenditure
    group: balance_sheet
    kind: ratio
    trend: true
    expr: payables_itr / total_expenditure_itr * 365
    guard: total_expenditure_itr

  - id: inventory_days
    label: Inventories in days of turnover
    group: balance_sheet
    kind: ratio
    trend: true
    expr: inventories_itr / turnover_itr * 365
    guard: turnover_itr

  - id: borrowings_total
    label: Total borrowings
    group: balance_sheet
    kind: money
    trend: true
    expr: secured_loans_itr + unsecured_loans_itr

  - id: effective_depreciation_rate
    label: Depreciation allowable to the opening block plus additions (%)
    group: depreciation
    kind: ratio
    trend: true
    expr: dep_allowable_3cd / (dep_opening_wdv_3cd + dep_additions_3cd) * 100
    guard: dep_opening_wdv_3cd

  - id: cash_disallowance_to_expenditure
    label: Section 40A(3) disallowance to total expenditure (%)
    group: disallowance
    kind: ratio
    trend: true
    expr: cash_disallowance_3cd / total_expenditure_3cd * 100
    guard: total_expenditure_3cd

  - id: unregistered_expenditure_share
    label: Expenditure with unregistered entities, share of total (%)
    group: pl
    kind: ratio
    trend: true
    expr: expenditure_unregistered_3cd / total_expenditure_3cd * 100
    guard: total_expenditure_3cd

  - id: tds_effective_rate
    label: Tax deducted to payments liable to deduction (%)
    group: tds
    kind: ratio
    trend: true
    expr: tds_deducted_3cd / tds_payments_3cd * 100
    guard: tds_payments_3cd

  - id: unpaid_43b_to_expenditure
    label: Unpaid 43B liability to total expenditure (%)
    group: statutory
    kind: ratio
    trend: true
    expr: unpaid_43b_3cd / total_expenditure_3cd * 100
    guard: total_expenditure_3cd

  - id: related_party_share
    label: Payments to specified persons, share of total expenditure (%)
    group: disallowance
    kind: ratio
    trend: true
    expr: payments_40a2b_3cd / total_expenditure_3cd * 100
    guard: total_expenditure_3cd

  - id: stock_movement
    label: Movement in stock over the year, per the quantitative details
    group: stock
    kind: money
    trend: true
    expr: qty_closing_stock_3cd - qty_opening_stock_3cd

  - id: pf_unpaid
    label: Employee contributions received but not paid
    group: disallowance
    kind: money
    trend: true
    expr: pf_employee_amount_3cd - pf_employee_paid_3cd

  - id: tds_interest_unpaid
    label: Interest under section 201(1A) reported but not paid
    group: tds
    kind: money
    trend: true
    expr: tds_interest_3cd - tds_interest_paid_3cd

  - id: gst_components_total
    label: Sum of the clause 44 expenditure components
    group: pl
    kind: money
    expr: expenditure_exempt_3cd + expenditure_composition_3cd + expenditure_other_registered_3cd + expenditure_unregistered_3cd

  - id: expenditure_from_credits
    label: Expenditure implied by the profit and loss account in the return
    group: pl
    kind: money
    trend: true
    expr: total_credits_itr - net_profit_itr
    guard: total_credits_itr

  - id: gp_ratio_itr
    label: Gross profit to turnover per the return (%)
    group: ratios
    kind: ratio
    trend: true
    expr: gross_profit_itr / turnover_itr * 100
    guard: turnover_itr

  - id: np_ratio_itr
    label: Net profit to turnover per the return (%)
    group: ratios
    kind: ratio
    trend: true
    expr: net_profit_itr / turnover_itr * 100
    guard: turnover_itr

  - id: gst_turnover_gap
    label: Turnover per the return less turnover reported under GST
    group: pl
    kind: money
    trend: true
    expr: turnover_itr - gst_turnover_itr

  - id: partner_remuneration_share
    label: Remuneration to partners, share of gross profit (%)
    group: pl
    kind: ratio
    trend: true
    expr: partner_remuneration_itr / gross_profit_itr * 100
    guard: gross_profit_itr
