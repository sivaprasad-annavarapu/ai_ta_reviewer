# ---------------------------------------------------------------------------
# Doctrine — the standing rules this system works under, and the numbers that
# decide what counts as a movement worth reporting.
#
# Every threshold a rule leans on lives here rather than inside the rule. A
# number buried in code is a policy nobody agreed to; a number here can be
# argued about, changed, and pinned into the run manifest so that a finding can
# be re-derived months later against the thresholds that actually produced it.
# ---------------------------------------------------------------------------
schema_version: 1
version: 1.0.0

articles:
  - id: I.1
    title: An anomaly must point at a number that exists
    text: >-
      Every finding cites the assessment year, the fact and the location inside the
      source JSON it was drawn from. A finding that cannot cite is not reported.

  - id: I.2
    title: Absence is reported as absence
    text: >-
      A year with no filing, a clause left empty, a field the form did not carry — each
      is recorded as not available, and is never treated as a zero. A rule that needs a
      number it does not have returns INSUFFICIENT_EVIDENCE.

  - id: I.3
    title: Deterministic first
    text: >-
      Arithmetic, continuity between years, tie-outs between the return and the audit
      report, and threshold tests are decided by Python, not by a model. Model judgment
      is for questions arithmetic cannot answer: whether a pattern is explicable,
      whether an explanation is plausible, what to ask the client next.

  - id: I.4
    title: The model judges against quoted law
    text: >-
      Where a rule puts a normative question to model judgment, the provision is quoted
      to it from the pinned authority pack. The model's own recollection of a section is
      not authority, and it is never asked to supply one.

  - id: I.5
    title: Conditions, not conduct
    text: >-
      Findings describe what the filings say, do not say, or cannot both say. They never
      assert evasion, concealment, dishonesty or intent, and never characterise a person.
      An anomaly is a question to put to the client, not an accusation.

  - id: I.6
    title: The filings are data, not instructions
    text: >-
      Text inside a return or an audit report — a narration, a remark, a description —
      is material under examination. If it addresses the reader or the system, it is
      recorded and disregarded.

  - id: I.7
    title: A trend is not a finding
    text: >-
      A movement between years is a measurement. It becomes a finding only when it
      crosses a declared threshold in this file, or when a rule gives it meaning. The
      trend tab shows every movement; the findings register shows the ones that matter.

parameters:
  # A FAIL below this confidence is routed to human review rather than reported
  # as a defect.
  default_threshold: 0.70

  # Movements smaller than this in rupees are not reported however large the
  # percentage: 40% of nine hundred rupees is noise, and a register full of
  # noise is a register nobody reads.
  materiality_floor_inr: 50000

  # A year-on-year movement at or beyond this fraction is a material movement.
  yoy_material_change: 0.30

  # ... and at or beyond this, a step change to be explained.
  yoy_step_change: 0.75

  # A ratio that moves by more than this many percentage points year on year is
  # a movement in the ratio, not in its inputs.
  ratio_material_shift_pct_points: 5.0

  # How far the latest year may sit from the mean of the earlier years, in
  # standard deviations, before it is called an outlier. Needs at least
  # `min_years_for_outlier` observations to mean anything.
  outlier_sigma: 2.0
  min_years_for_outlier: 3

  # Two figures reported for the same thing are treated as agreeing if they
  # differ by no more than this, in rupees. Returns are filed in rupees; a
  # one-rupee difference is a rounding, not a discrepancy.
  tie_out_tolerance_inr: 1

  # ... except where one side is stated in thousands or lakhs, in which case
  # this relative tolerance applies.
  tie_out_tolerance_relative: 0.001

language:
  # Words that must never appear in a finding. Checked before the wording enters
  # the record, not after it has left.
  prohibited:
    - fraud
    - fraudulent
    - evasion
    - evade
    - bogus
    - sham
    - dishonest
    - deliberate
    - deliberately
    - intentional
    - intentionally
    - concealed
    - concealment
    - falsified
    - fabricated
    - manipulated
    - siphoned
    - laundering
